<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decision Helper | Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="main.css" />
</head>
<body>

<header id="site-header">
  <div class="app-shell">
    <div class="brand">
      <h1>Decision Helper</h1>
      <span class="tagline">Make decisions less painful</span>
    </div>

    <nav class="site-nav">
      <a class="active" href="index.html">Home</a>
      <a href="play.html">Play</a>
      <a href="scores.html">Scores</a>
      <a href="about.html">About</a>
    </nav>
  </div>
</header>

<main class="site-main">
  <div class="app-shell">
    <h2 class="page-title">Welcome</h2>
    <p class="page-subtitle">This is the Decision Helper home page.</p>

    <section class="cardish">
      <h3 class="h5 mb-3">Login</h3>

      <form>
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
          />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
          />
        </div>

        <button type="button">Login</button>
      </form>

      <p class="mt-3 mb-0"><strong>Logged in as:</strong> guest</p>
    </section>
  </div>
</main>

<footer id="site-footer">
  <div class="app-shell">
    <p class="mb-1">Created by Tyler Nichols</p>
    <p class="mb-0">
      <a href="https://github.com/aztyler77-ux/startup" target="_blank" rel="noopener noreferrer">
        GitHub Repository
      </a>
    </p>
  </div>
</footer>

</body>
</html>
